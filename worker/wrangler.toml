name = "recipe-book-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[env.production]
name = "recipe-book-worker"
workers_dev = false

# Secrets are set via: wrangler secret put SECRET_NAME
# Required secrets:
#   DROPBOX_APP_KEY
#   DROPBOX_APP_SECRET
#   DROPBOX_REDIRECT_URI
#   GEMINI_API_KEY
#   GEMINI_API_KEY_2              (optional — fallback if quota ends)
#   JWT_SECRET
#   FAMILY_DROPBOX_REFRESH_TOKEN   (after family setup)
